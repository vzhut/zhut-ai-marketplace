version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-dependencies:
        patterns: ['*']
    ignore:
      # eslint-plugin-jsx-a11y does not support ESLint 10 yet (npm ERESOLVE), so stay on ESLint 9.
      # Remove these rules once the plugin's peer range includes ESLint 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # typescript-eslint does not support TypeScript 7 yet (npm ERESOLVE), so stay on TypeScript 6.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node must match the Node version CI runs on (22), not the latest major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
